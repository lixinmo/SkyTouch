name: Build SkyTouch

on:
  push:
    branches: [main, skytouch-2.0]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skytouch-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      LC_ALL: C
      LANG: C
      PYTHONDONTWRITEBYTECODE: 1
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check source privacy
        run: /usr/bin/python3 scripts/check_source_privacy.py

      - name: Check build tools
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          /usr/bin/python3 --version

      - name: Verify bundled dependencies
        run: |
          /usr/bin/python3 scripts/prepare_original.py
          /usr/bin/python3 scripts/verify_original.py

      - name: Build and sign
        run: bash scripts/build_candidate.sh

      - name: Package and verify
        run: /usr/bin/python3 scripts/build_package.py

      - name: Create package checksum
        working-directory: dist
        run: shasum -a 256 com.lixinmo.skytouch_*_iphoneos-arm64e.deb > SHA256SUMS

      - name: Upload installable package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SkyTouch-${{ github.run_number }}
          path: |
            dist/*.deb
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          include-hidden-files: false
